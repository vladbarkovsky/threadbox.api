name: CI
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: self-hosted
    env:
      DOTNET_ROOT: /home/pi/.dotnet
    defaults:
      run:
        working-directory: ThreadboxApi
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Add dotnet to PATH
      run: echo "$HOME/.dotnet:$PATH" >> $GITHUB_PATH
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
  docker:
    runs-on: self-hosted
    needs: build
    defaults:
      run:
        working-directory: ThreadboxApi
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t threadbox-api:${{ github.sha }} .
