name: Release
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ThreadboxApi
    steps:
    - uses: actions/checkout@v3
    - name: Deploy containers
      run: |
        set -euxo pipefail

        docker compose down || true
        docker compose up -d --build

    - name: Wait
      run: sleep 10

    - name: Check containers
      run: |
        set -euo pipefail

        echo "==== CONTAINER STATUS ===="
        docker compose ps

        FAILED=0

        for SERVICE in $(docker compose config --services); do
          CONTAINER=$(docker compose ps -q $SERVICE)

          echo ""
          echo "==== Checking $SERVICE ===="

          STATUS=$(docker inspect -f '{{.State.Status}}' $CONTAINER)
          EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' $CONTAINER)

          echo "Status: $STATUS"
          echo "Exit code: $EXIT_CODE"

          echo "---- Logs for $SERVICE ----"
          docker logs $CONTAINER --tail=100 || true

          if [ "$STATUS" != "running" ]; then
            echo "$SERVICE is not running."
            FAILED=1
          fi
        done

        if [ "$FAILED" -ne 0 ]; then
          echo ""
          echo "One or more containers failed."
          exit 1
        fi

        echo ""
        echo "Deploy completed successfully."
      env:
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        CONNECTION_STRINGS__DATABASE: ${{ secrets.CONNECTION_STRINGS__DATABASE }}
        DEFAULT_ADMIN_CREDENTIALS__PASSWORD: ${{ secrets.DEFAULT_ADMIN_CREDENTIALS__PASSWORD }}
        OIDC_BFF_CLIENT_SECRET: ${{ secrets.OIDC_BFF_CLIENT_SECRET }}
        SSL_PASSWORD: ${{ secrets.SSL_PASSWORD }}
