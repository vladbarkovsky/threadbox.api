name: Release
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ThreadboxApi
    steps:
    - uses: actions/checkout@v3
    - name: Clean containers
      run: |
        set -euo pipefail
        docker compose down || true
    - name: Deploy (CI)
      run: |
        set -euo pipefail
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
    - name: Wait
      run: sleep 10
    - name: Check containers
      run: |
        set -euo pipefail

        echo "================ CONTAINER STATUS ================"
        docker compose ps

        FAILED=0

        for SERVICE in $(docker compose config --services); do
          CONTAINER=$(docker compose ps -q $SERVICE)

          echo ""
          echo "================ Checking $SERVICE ================"

          STATUS=$(docker inspect -f '{{.State.Status}}' "$CONTAINER")
          RESTARTING=$(docker inspect -f '{{.State.Restarting}}' "$CONTAINER")
          EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' "$CONTAINER")
          RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$CONTAINER")

          echo "Status: $STATUS"
          echo "Restarting: $RESTARTING"
          echo "Exit code: $EXIT_CODE"
          echo "Restarts: $RESTARTS"

          echo "---------------- Logs for $SERVICE ----------------"
          docker logs $CONTAINER --tail=200 || true

          if [ "$STATUS" != "running" ] || [ "$RESTARTING" = "true" ] || [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "" ]; then
              echo "$SERVICE is unhealthy"
              FAILED=1
            fi
        done

        if [ "$FAILED" -ne 0 ]; then
          echo ""
          echo "One or more containers failed."
          exit 1
        fi

        echo ""
        echo "Deploy completed successfully."
      env:
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        CONNECTION_STRINGS__DATABASE: ${{ secrets.CONNECTION_STRINGS__DATABASE }}
        DEFAULT_ADMIN_CREDENTIALS__PASSWORD: ${{ secrets.DEFAULT_ADMIN_CREDENTIALS__PASSWORD }}
        OIDC_BFF_CLIENT_SECRET: ${{ secrets.OIDC_BFF_CLIENT_SECRET }}
        SSL_PASSWORD: ${{ secrets.SSL_PASSWORD }}
