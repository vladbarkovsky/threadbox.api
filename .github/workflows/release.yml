name: Release
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v3
    - name: Docker
      working-directory: ThreadboxApi
      run: |
        docker compose down -v
        docker compose up -d --build

        echo "Container statuses:"
        docker compose ps

        for container in postgres threadbox-api nginx; do
          echo "Logs for $container:"
          docker compose logs --no-color --tail=200 $container || true
        done
      env:
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        CONNECTION_STRINGS__DATABASE: ${{ secrets.CONNECTION_STRINGS__DATABASE }}
        DEFAULT_ADMIN_CREDENTIALS__PASSWORD: ${{ secrets.DEFAULT_ADMIN_CREDENTIALS__PASSWORD }}
        OIDC_BFF_CLIENT_SECRET: ${{ secrets.OIDC_BFF_CLIENT_SECRET }}
        SSL_PASSWORD: ${{ secrets.SSL_PASSWORD }}
