name: CD
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (commit SHA)"
        required: true
jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ThreadboxApi
    env:
      CONNECTION_STRINGS__POSTGRES: ${{ secrets.CONNECTION_STRINGS__POSTGRES }}
      DEFAULT_ADMIN_CREDENTIALS__PASSWORD: ${{ secrets.DEFAULT_ADMIN_CREDENTIALS__PASSWORD }}
      OIDC_BFF_CLIENT_SECRET: ${{ secrets.OIDC_BFF_CLIENT_SECRET }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add dotnet to PATH
        run: echo "$HOME/.dotnet:$PATH" >> $GITHUB_PATH
      - name: Apply EF migrations
        working-directory: .
        env:
          ConnectionStrings__Postgres: ${{ secrets.CONNECTION_STRINGS__POSTGRES }}
          DOTNET_ROOT: /home/pi/.dotnet
        run: |
          dotnet tool restore
          dotnet ef database update --project ThreadboxApi --context ApplicationDbContext --configuration Release
      - name: Stop running container
        run: IMAGE_TAG=${{ inputs.image_tag }} docker compose down
      - name: Bring up Docker container
        run: IMAGE_TAG=${{ inputs.image_tag }} docker compose up -d
