services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: threadbox_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  threadbox-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Release
      ASPNETCORE_URLS: http://+:8080
      AppSettings__ConnectionStrings__Postgres: ${CONNECTION_STRINGS__POSTGRES}
      AppSettings__DefaultAdminCredentials__Password: ${DEFAULT_ADMIN_CREDENTIALS__PASSWORD}
      AppSettings__OidcBffClientSecret: ${OIDC_BFF_CLIENT_SECRET}
      AppSettings__SslPassword: ${SSL_PASSWORD}
    expose:
      - "8080"
    volumes:
      - /etc/threadbox/certs:/certs:ro
    depends_on:
      - postgres
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/threadbox/certs:/certs:ro
    depends_on:
      - threadbox-api
volumes:
  pgdata:
