services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: threadbox_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - /etc/threadbox/certs:/certs:ro
      - /etc/threadbox/pg_hba.conf:/pg_hba.conf:ro
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/certs/cert.crt
      -c ssl_key_file=/certs/cert.key
      -c pg_hba_file=/pg_hba.conf
  threadbox-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Postgres: ${CONNECTION_STRINGS__POSTGRES}
      DefaultAdminCredentials__Password: ${DEFAULT_ADMIN_CREDENTIALS__PASSWORD}
      OidcBffClientSecret: ${OIDC_BFF_CLIENT_SECRET}
      SslPassword: ${SSL_PASSWORD}
    expose:
      - "8080"
    volumes:
      - /etc/threadbox/certs:/certs:ro
      - /var/log/threadbox/api:/logs:ro
    depends_on:
      - postgres
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/threadbox/certs:/certs:ro
    depends_on:
      - threadbox-api
volumes:
  pgdata:
