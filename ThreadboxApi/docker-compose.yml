services:
  threadbox-api:
      image: threadbox-api:${IMAGE_TAG}
      restart: unless-stopped
      environment:
        ASPNETCORE_ENVIRONMENT: Production
        ASPNETCORE_URLS: http://+:5000
        ConnectionStrings__Postgres: ${CONNECTION_STRINGS__POSTGRES}
        OidcBffClientSecret: ${OIDC_BFF_CLIENT_SECRET}
        SigningPfxPassword: ${SIGNING_PFX_PASSWORD}
      expose:
        - "5000"
      volumes:
        - /opt/signing.pfx:/certs/signing.pfx:ro
        - /var/log/threadbox/api:/logs
      networks:
        - threadbox
networks:
  threadbox:
    external: true
    name: threadbox-network
